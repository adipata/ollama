[project]
name = "ollama-vllm-proxy"
version = "0.1.0"
description = "Ollama-compatible proxy in front of vLLM, with API keys, Runpod deployment and monitoring"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "anyio>=4.4",
  "asyncssh>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "ollama>=0.4", "openai>=1.50"]

[project.scripts]
ollama-vllm-proxy = "ollama_vllm_proxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_vllm_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
# gpu_exporter.py is vendored unchanged; never reformat it.
extend-exclude = ["src/ollama_vllm_proxy/pod/remote"]
